server.port=8083

spring.application.name=marketplace-system
spring.application.base-url=localhost:8083
spring.application.auth.domain=localhost

# Front-end Configuration
third-party.frontend.base-url=localhost:5173
third-party.google.client-id=your-google-oauth-client-id.apps.googleusercontent.com
third-party.facebook.app-id=your-facebook-app-id
third-party.facebook.app-secret=your-facebook-app-secret
third-party.gemini.api-key=your-gemini-api-key
third-party.gemini.model=gemini-3.8-flash
third-party.groq.api-key=your-groq-api-key
third-party.groq.model=openai/gpt-oss-20b
third-party.groq.base-url=https://api.groq.com/openai/v1

# DB Configuration
spring.datasource.url= jdbc:postgresql://localhost:5432/marketplace_management_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Logging Configuration
spring.main.banner-mode=off
logging.level.org.springframework=OFF
logging.level.org.hibernate=OFF
logging.level.org.apache=OFF
logging.level.com.zaxxer.hikari=OFF
spring.devtools.restart.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# JWT Configuration
jwt.issuer=auth-service
jwt.expiration=7
jwt.refresh-token-expiration=14
jwt.private-key=classpath:keys/private.pem
jwt.public-key=classpath:keys/public.pem

# SMTP Configuration
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms

# true: 500 responses include the exception class, cause and stack trace (never in production)
app.debug=false
