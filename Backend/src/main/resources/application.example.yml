server:
  port: 8083

spring:
  application:
    environment: production
    name: store-management-system
    base-url: http://localhost:8083
    auth:
      domain: localhost
      secure: false
      samesite: none
      http-only: true

  datasource:
    url: jdbc:postgresql://localhost:5432/store_management_db
    username: postgres
    password: 1
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  main:
    banner-mode: off
    
  devtools:
      restart:
        enabled: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    
  jooq:
    sql-dialect: POSTGRES

  mail:
    host: your-smtp-host
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms

third-party:
  frontend:
    base-url: http://localhost:5173
  google:
    client-id: your-google-oauth-client-id.apps.googleusercontent.com
  facebook:
    app-id: your-facebook-app-id
    app-secret: your-facebook-app-secret
  gemini:
    api-key: your-gemini-api-key
    model: gemini-3.8-flash
  groq:
    api-key: your-groq-api-key
    model: openai/gpt-oss-20b
    base-url: https://api.groq.com/openai/v1
    
# Logging Configuration
logging:
  level:
    org:
      springframework: OFF
      hibernate: OFF
      apache: OFF
    com:
      zaxxer:
        hikari: OFF

jwt:
  issuer: auth-service
  expiration: 7
  refresh-token-expiration: 14
  private-key: classpath:keys/private.pem
  public-key: classpath:keys/public.pem

# true: 500 responses include the exception class, cause and stack trace (never in production)
app:
  debug: false
